<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SB Phone Directory - Thoothukudi District Police</title>
<link rel="stylesheet" href="assets/css/variables.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/layout.css">
</head>
<body>

<header class="app-header">
  <div class="app-header__title">
    <strong id="org-name">District Special Branch</strong>
    <span id="org-subtitle">Thoothukudi District Police</span>
  </div>
  <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode">🌙</button>
</header>

<nav class="module-nav" id="module-nav">
  <button class="module-nav__btn is-active" type="button" data-module="directory">SB</button>
  <button class="module-nav__btn" type="button" data-module="officers" data-type="adsp">ADSsP</button>
  <button class="module-nav__btn" type="button" data-module="officers" data-type="sdpo">SDPOs</button>
  <button class="module-nav__btn" type="button" data-module="officers" data-type="sho">SHOs</button>
  <button class="module-nav__btn" type="button" data-module="officers" data-type="ministerial">Ministerial Stfs</button>
</nav>

<main class="app-main">
  <div id="directory-content"></div>
  <div id="officers-content" style="display:none"></div>
  <div class="footer-meta">SB Phone Directory &middot; Version 1.0</div>
</main>

<script src="js/config.js"></script>
<script src="js/core/dom.js"></script>
<script src="js/core/theme.js"></script>
<script src="js/core/ui.js"></script>
<script src="js/core/store.js"></script>
<script src="js/core/api.js"></script>
<script src="js/modules/directory/directory.filter.js"></script>
<script src="js/modules/directory/directory.view.js"></script>
<script src="js/modules/directory/directory.js"></script>
<script src="js/modules/officers/officers.filter.js"></script>
<script src="js/modules/officers/officers.view.js"></script>
<script src="js/modules/officers/officers.js"></script>
<script src="js/app.js"></script>
</body>
</html>
